name: Build APK Naruto Senki

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # Menggunakan server terbaru agar antrean sepi

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Java JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11' # Versi JDK standar untuk project Android Studio
          distribution: 'temurin'
          cache: gradle

      - name: Berikan Izin Eksekusi Sistem
        run: |
          cd NarutoSenki-V2-master/proj.android-studio || cd NarutoSenki-V2-master
          chmod +x gradlew || true

      - name: Mulai Compile APK via Android Gradle
        run: |
          cd NarutoSenki-V2-master/proj.android-studio || cd NarutoSenki-V2-master
          ./gradlew assembleDebug --no-daemon

      - name: Upload Output APK Sukses
        uses: actions/upload-artifact@v4
        with:
          name: Narsen-1v1-Multiplayer-APK
          path: NarutoSenki-V2-master/**/build/outputs/apk/**/*.apk









      










