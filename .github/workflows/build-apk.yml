name: Build APK Naruto Senki

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Java JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8' # Diturunkan ke versi 8 agar pas dengan Gradle lama game Anda
          distribution: 'temurin'
          cache: gradle

      - name: Hubungkan Android NDK Bawaan Server
        run: |
          NDK_PATH="$ANDROID_HOME/ndk/21.4.7075529"
          if [ -d "$NDK_PATH" ]; then
            echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          else
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk-bundle" >> $GITHUB_ENV
          fi

      - name: Berikan Izin Eksekusi Sistem
        run: |
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          chmod +x gradlew

      - name: Mulai Compile APK via Android Gradle
        run: |
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          ./gradlew assembleDebug --no-daemon -Pandroid.ndkPath=${{ env.ANDROID_NDK_ROOT }}

      - name: Upload Output APK Sukses
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Narsen-1v1-Multiplayer-APK
          path: NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/build/outputs/apk/debug/*.apk












      










