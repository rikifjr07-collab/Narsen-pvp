name: Build APK Naruto Senki Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Pasang Java 8 dan Trik Library Linux Lawas
        run: |
          # 1. Pasang paket dasar wajib bawaan server
          sudo apt-get update
          sudo apt-get install -y openjdk-8-jdk unzip wget curl make libncurses6

          # 2. TRIK JITU: Mengakali skrip jadul dengan membuat symlink library versi 6 menyamar menjadi versi 5
          sudo ln -s /lib/x86_64-linux-gnu/libncursesw.so.6 /lib/x86_64-linux-gnu/libncurses.so.5
          sudo ln -s /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5

      - name: Pasang NDK r10e
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r10e
          local-cache: true

      - name: Jalankan Proses Perakitan Game
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64

          # Mengakali folder toolchain NDK 64-bit agar terbaca oleh skrip game jadul
          ln -s $ANDROID_NDK_HOME/toolchains/arm-linux-androideabi-4.9/prebuilt/linux-x86_64 $ANDROID_NDK_HOME/toolchains/arm-linux-androideabi-4.9/prebuilt/linux-x86 || true
          ln -s $ANDROID_NDK_HOME/toolchains/llvm-3.6/prebuilt/linux-x86_64 $ANDROID_NDK_HOME/toolchains/llvm-3.6/prebuilt/linux-x86 || true

          # Menyuntikkan identitas berkas versi agar Gradle mengenali NDK r10e lawas
          echo -e "Pkg.Desc = Android NDK\nPkg.Revision = 10.5.0" > $ANDROID_NDK_HOME/source.properties

          # 2. Daftarkan jalur NDK and SDK ke konfigurasi proyek game kamu
          echo -e "ndk.dir=$ANDROID_NDK_HOME\nsdk.dir=$ANDROID_HOME" > NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/local.properties

          # 3. KUNCI UTAMA: Konfigurasi Compiler Flag Modern
          find $GITHUB_WORKSPACE -name "Android.mk" -type f -exec sed -i 's/-std=c++2a/-std=gnu++11 -fpermissive -w -D_GLIBCXX_USE_CXX11_ABI=0/g' {} +
          find $GITHUB_WORKSPACE -name "Android.mk" -type f -exec sed -i 's/-std=c++11/-std=gnu++11 -fpermissive -w -D_GLIBCXX_USE_CXX11_ABI=0/g' {} +
          find $GITHUB_WORKSPACE -name "Android.mk" -type f -exec sed -i 's/-std=gnu++03/-std=gnu++11 -fpermissive -w -D_GLIBCXX_USE_CXX11_ABI=0/g' {} +
          find $GITHUB_WORKSPACE -name "Application.mk" -type f -exec sed -i 's/-std=c++2a/-std=gnu++11/g' {} +
          find $GITHUB_WORKSPACE -name "Application.mk" -type f -exec sed -i 's/-std=c++11/-std=gnu++11/g' {} +
          find $GITHUB_WORKSPACE -name "Application.mk" -type f -exec sed -i 's/-std=gnu++03/-std=gnu++11/g' {} +
          
          # Trik membersihkan static_assert
          find $GITHUB_WORKSPACE -type f \( -name "*.h" -o -name "*.cpp" \) -exec sed -i 's/static_assert/ \/\/ static_assert_dihapus/g' {} +

          # PATCH KHUSUS CCMap.h: Mengubah perulangan range-based yang eror menjadi perulangan iterator konvensional
          find $GITHUB_WORKSPACE -name "CCMap.h" -type f -exec sed -i 's/for\s*(\s*const\s*auto&\s*iter\s*:\s*_data\s*)/for (auto iter = _data.begin(); iter != _data.end(); ++iter)/g' {} +
          find $GITHUB_WORKSPACE -name "CCMap.h" -type f -exec sed -i 's/iter\.second/iter->second/g' {} +
          find $GITHUB_WORKSPACE -name "CCMap.h" -type f -exec sed -i 's/iter\.first/iter->first/g' {} +

          # 4. TANCAP GAS FINAL: Mulai Eksekusi Perakitan APK Game
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          chmod +x gradlew
          
          # PERBAIKAN PETA FOLDER: Menyambungkan modul agar pustaka terdeteksi sempurna
          export NDK_MODULE_PATH=$GITHUB_WORKSPACE/NarutoSenki-V2-master:$GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx:$GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx/platform/third_party/android:$GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx/platform/third_party/android/prebuilt:$GITHUB_WORKSPACE/NarutoSenki-V2-master/CocosDenshion/android
          
          ./gradlew assembleDebug --no-daemon

      - name: Upload Output APK Sukses
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Narsen-Multiplayer-APK
          path: NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/build/outputs/apk/debug/*.apk
          
