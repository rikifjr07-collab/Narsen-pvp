name: Build APK Naruto Senki

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Pasang NDK r10e di Server Luar
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r10e
          local-cache: true

      - name: Jalankan Kompilasi Menggunakan Kontainer Docker Ubuntu 20.04
        uses: docker://ubuntu:20.04
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          # MENARIK JALUR SDK RESMI: Menyambungkan folder Android SDK bawaan server luar agar terbaca di dalam Docker
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          GITHUB_WORKSPACE: ${{ github.workspace }}
        with:
          entrypoint: /bin/bash
          # AMUNISI FINAL: Menyuntikkan ndk.dir DAN sdk.dir secara bersamaan ke file local.properties proyek game kamu
          args: -c "apt-get update && apt-get install -y openjdk-8-jdk libncurses5 libtinfo5 unzip && export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 && echo -e 'ndk.dir='$ANDROID_NDK_HOME'\nsdk.dir=/usr/local/lib/android/sdk' > NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/local.properties && cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/jni/ && mkdir -p cocos2dx CocosDenshion extensions scripting && cp -r ../../../../../cocos2dx/* ./cocos2dx/ && cp -r ../../../../../CocosDenshion/* ./CocosDenshion/ && cp -r ../../../../../extensions/* ./extensions/ && cp -r ../../../../../scripting/* ./scripting/ && cp -r ./cocos2dx/platform/third_party/android/prebuilt/libjpeg ./ && cp -r ./cocos2dx/platform/third_party/android/prebuilt/libpng ./ && cp -r ./cocos2dx/platform/third_party/android/prebuilt/libtiff ./ && cp -r ./cocos2dx/platform/third_party/android/prebuilt/libwebp ./ && ln -s armeabi-v7a libjpeg/libs/armeabi || true && ln -s armeabi-v7a libpng/libs/armeabi || true && ln -s armeabi-v7a libtiff/libs/armeabi || true && ln -s armeabi-v7a libwebp/libs/armeabi || true && ln -s armeabi-v7a scripting/lua/luajit/android/armeabi || true && mkdir -p zlib && echo -e 'LOCAL_PATH := \$(call my-dir)\ninclude \$(CLEAR_VARS)\nLOCAL_MODULE := cocos_zlib_static\nLOCAL_EXPORT_LDLIBS := -lz\ninclude \$(BUILD_STATIC_LIBRARY)' > zlib/Android.mk && cd ../../ && chmod +x gradlew && export NDK_MODULE_PATH=$GITHUB_WORKSPACE/NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/jni && ./gradlew assembleDebug --no-daemon"

      - name: Upload Output APK Sukses
        uses: actions/upload-artifact@v4
        with:
          name: Narsen-1v1-Multiplayer-APK
          path: NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/build/outputs/apk/debug/*.apk
          
