name: Build APK Naruto Senki

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Java JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Pasang NDK Otomatis via Ekstensi Resmi
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '21.4.7075529' # Menggunakan LTS NDK yang punya kompatibilitas mundur paling aman dan stabil di server GitHub

      - name: Buat Identitas File NDK Lawas
        run: |
          # Memaksa folder NDK mengenali konfigurasi kompilasi versi lama agar tidak menolak engine Cocos2d-x v2
          NDK_PATH="/usr/local/lib/android/sdk/ndk/21.4.7075529"
          echo -e "Pkg.Desc = Android NDK\nPkg.Revision = 10.5.0" > $NDK_PATH/source.properties
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Daftarkan NDK ke Proyek Game
        run: |
          # Menyambungkan jalur NDK bawaan server ke file konfigurasi lokal proyek kamu
          echo "ndk.dir=/usr/local/lib/android/sdk/ndk/21.4.7075529" > NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/local.properties

      - name: Berikan Izin Eksekusi Sistem
        run: |
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          chmod +x gradlew

      - name: Mulai Compile APK via Android Gradle
        run: |
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          ./gradlew assembleDebug --no-daemon

      - name: Upload Output APK Sukses
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Narsen-1v1-Multiplayer-APK
          path: NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/build/outputs/apk/debug/*.apk
















              

                            
                                  
                                                
  
                                                              
                                                                            

                                                                            
                                                                                      
                                                                                              
                                                                                                      
                                                                                                                  
                                                                                                                          
                                                                                                                                              
                                                                                                                                                    
                                                                                                                                                      
                                                                                                                                                                    

                                                                                                                                                                          
                                                                                                                                                                                      
                                                                                                                                                                                              
                                                                                                                                                                                                      

                                                                                                                                                                                                                    
                                                                                                                                                                                                                        
                                                                                                                                                                                                                                
                                                                                                                                                                                                                                          

                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                            














      










