name: Build APK Naruto Senki

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Java JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Pasang NDK r10e Otomatis
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r10e
          local-cache: true

      - name: Buat Identitas File NDK Lawas
        run: |
          echo -e "Pkg.Desc = Android NDK\nPkg.Revision = 10.5.0" > ${{ steps.setup-ndk.outputs.ndk-path }}/source.properties
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Daftarkan NDK ke Proyek Game
        run: |
          echo "ndk.dir=${{ steps.setup-ndk.outputs.ndk-path }}" > NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/local.properties

      - name: Taktik Pindah Folder Sempurna & Duplikat Arsitektur
        run: |
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/jni/
          
          # 1. Membuat folder penampung untuk modul utama game
          mkdir -p cocos2dx
          mkdir -p CocosDenshion
          
          # 2. Menyalin seluruh isi core engine game
          cp -r ../../../../../cocos2dx/* ./cocos2dx/
          cp -r ../../../../../CocosDenshion/* ./CocosDenshion/
          
          # 3. Menyalin folder library grafis utuh ke tingkat terdepan
          cp -r ./cocos2dx/platform/third_party/android/prebuilt/libjpeg ./
          cp -r ./cocos2dx/platform/third_party/android/prebuilt/libpng ./
          cp -r ./cocos2dx/platform/third_party/android/prebuilt/libtiff ./
          cp -r ./cocos2dx/platform/third_party/android/prebuilt/libwebp ./

          # 4. Duplikat folder arsitektur armeabi agar file .a terbaca compiler lawas
          mkdir -p libjpeg/libs/armeabi && cp libjpeg/libs/armeabi-v7a/* libjpeg/libs/armeabi/ || true
          mkdir -p libpng/libs/armeabi && cp libpng/libs/armeabi-v7a/* libpng/libs/armeabi/ || true
          mkdir -p libtiff/libs/armeabi && cp libtiff/libs/armeabi-v7a/* libtiff/libs/armeabi/ || true
          mkdir -p libwebp/libs/armeabi && cp libwebp/libs/armeabi-v7a/* libwebp/libs/armeabi/ || true

          # 5. KOREKSI RUTE: Salin paksa modul cpufeatures & zlib dari lokasi internal NDK yang benar
          cp -r ${{ steps.setup-ndk.outputs.ndk-path }}/sources/android/cpufeatures ./
          cp -r ${{ steps.setup-ndk.outputs.ndk-path }}/sources/third_party/zlib ./

      - name: Berikan Izin Eksekusi Sistem
        run: |
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          chmod +x gradlew

      - name: Mulai Compile APK via Android Gradle
        run: |
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          
          # Mengunci jalur modul hanya pada satu titik folder jni yang sudah super lengkap
          export NDK_MODULE_PATH=$GITHUB_WORKSPACE/NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/jni
          
          ./gradlew assembleDebug --no-daemon

      - name: Upload Output APK Sukses
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Narsen-1v1-Multiplayer-APK
          path: NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/build/outputs/apk/debug/*.apk
          
