name: Build APK Naruto Senki

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Java JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: gradle

      - name: Unduh dan Ekstrak NDK Lokal
        run: |
          # Mengunduh NDK resmi langsung ke folder kerja lokal agar tidak dikunci server
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          wget -q https://google.com
          unzip -q android-ndk-r16b-linux-x86_64.zip
          
          # Mengunci file local.properties ke folder NDK lokal yang baru diekstrak
          echo "ndk.dir=$PWD/android-ndk-r16b" > local.properties
          echo "sdk.dir=/usr/local/lib/android/sdk" >> local.properties

      - name: Berikan Izin Eksekusi Sistem
        run: |
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          chmod +x gradlew

      - name: Mulai Compile APK via Android Gradle
        run: |
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          ./gradlew assembleDebug --no-daemon

      - name: Upload Output APK Sukses
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Narsen-1v1-Multiplayer-APK
          path: NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/build/outputs/apk/debug/*.apk

              

                            
                                  
                                                
  
                                                              
                                                                            

                                                                            
                                                                                      
                                                                                              
                                                                                                      
                                                                                                                  
                                                                                                                          
                                                                                                                                              
                                                                                                                                                    
                                                                                                                                                      
                                                                                                                                                                    

                                                                                                                                                                          
                                                                                                                                                                                      
                                                                                                                                                                                              
                                                                                                                                                                                                      

                                                                                                                                                                                                                    
                                                                                                                                                                                                                        
                                                                                                                                                                                                                                
                                                                                                                                                                                                                                          

                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                            














      










