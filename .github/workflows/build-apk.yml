name: Build APK Naruto Senki

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Pasang Java JDK 17 (Untuk Lisensi)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setujui Lisensi Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

      - name: Alihkan ke Java JDK 8 (Untuk Kompilasi Game)
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: gradle

      - name: Akali Folder Platforms NDK Bawaan Server
        run: |
          # Membuat folder platform tiruan agar Gradle mendeteksi NDK-nya valid
          NDK_DIR="/usr/local/lib/android/sdk/ndk/27.3.13750724"
          sudo mkdir -p "$NDK_DIR/platforms/android-21"
          sudo touch "$NDK_DIR/platforms/android-21/android.jar"
          
          # Tulis rute NDK resmi ke local.properties proyek game
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          echo "ndk.dir=$NDK_DIR" > local.properties
          echo "sdk.dir=/usr/local/lib/android/sdk" >> local.properties

      - name: Berikan Izin Eksekusi Sistem
        run: |
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          chmod +x gradlew

      - name: Mulai Compile APK via Android Gradle
        run: |
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          ./gradlew assembleDebug --no-daemon --stacktrace -Pandroid.useDeprecatedNdk=true

      - name: Upload Output APK Sukses
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Narsen-1v1-Multiplayer-APK
          path: NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/build/outputs/apk/debug/*.apk








              

                            
                                  
                                                
  
                                                              
                                                                            

                                                                            
                                                                                      
                                                                                              
                                                                                                      
                                                                                                                  
                                                                                                                          
                                                                                                                                              
                                                                                                                                                    
                                                                                                                                                      
                                                                                                                                                                    

                                                                                                                                                                          
                                                                                                                                                                                      
                                                                                                                                                                                              
                                                                                                                                                                                                      

                                                                                                                                                                                                                    
                                                                                                                                                                                                                        
                                                                                                                                                                                                                                
                                                                                                                                                                                                                                          

                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                            














      










