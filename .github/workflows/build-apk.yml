name: Build APK Naruto Senki

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Pasang Alat Dasar Kontainer
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y tzdata software-properties-common curl wget unzip git

      - name: Set up Java JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Gunakan Android NDK Bawaan Server
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk-bundle" >> $GITHUB_ENV
          echo "$ANDROID_HOME/ndk-bundle" >> $GITHUB_PATH

      - name: Cari dan Masuk ke Folder Proyek Game
        run: |
          if [ -f "NarutoSenki-V2-master/download-deps.py" ]; then
            echo "GAME_DIR=NarutoSenki-V2-master" >> $GITHUB_ENV
          elif [ -f "NarutoSenki-V2-master/projects/NarutoSenki/download-deps.py" ]; then
            echo "GAME_DIR=NarutoSenki-V2-master/projects/NarutoSenki" >> $GITHUB_ENV
          else
            echo "GAME_DIR=$PWD" >> $GITHUB_ENV
          fi

      - name: Install Cocos Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y python2.7 libx11-dev libxmu-dev libglu1-mesa-dev libgl2ps-dev libxi-dev libzip-dev libpng-dev libcurl4-gnutls-dev libfontconfig1-dev libsqlite3-dev
          ln -sf /usr/bin/python2.7 /usr/bin/python
          cd ${{ env.GAME_DIR }}
          python download-deps.py --auto || true

      - name: Compile APK via Cocos CLI
        run: |
          cd ${{ env.GAME_DIR }}
          python setup.py
          source ~/.bashrc || true
          cocos compile -p android --ap android-19 -m debug









