name: Build APK Naruto Senki

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Java JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Unduh NDK r10e Otomatis
        run: |
          cd $HOME
          wget https://google.com
          unzip -q android-ndk-r10e-linux-x86_64.zip
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r10e" >> $GITHUB_ENV

      - name: Berikan Izin Eksekusi Sistem
        run: |
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          chmod +x gradlew

      - name: Mulai Compile APK via Android Gradle
        run: |
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          ./gradlew assembleDebug --no-daemon

      - name: Upload Output APK Sukses
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Narsen-1v1-Multiplayer-APK
          path: NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/build/outputs/apk/debug/*.apk












              

                            
                                  
                                                
  
                                                              
                                                                            

                                                                            
                                                                                      
                                                                                              
                                                                                                      
                                                                                                                  
                                                                                                                          
                                                                                                                                              
                                                                                                                                                    
                                                                                                                                                      
                                                                                                                                                                    

                                                                                                                                                                          
                                                                                                                                                                                      
                                                                                                                                                                                              
                                                                                                                                                                                                      

                                                                                                                                                                                                                    
                                                                                                                                                                                                                        
                                                                                                                                                                                                                                
                                                                                                                                                                                                                                          

                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                            














      










