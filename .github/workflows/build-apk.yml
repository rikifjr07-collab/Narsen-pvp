name: Build APK Naruto Senki

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Pasang NDK r10e di Server Luar (Aman & Instan)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r10e
          local-cache: true

      - name: Jalankan Kompilasi Menggunakan Kontainer Docker Ubuntu 20.04
        uses: docker://ubuntu:20.04
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        with:
          args: |
            bash -c "
            # 1. Update server internal dan pasang komponen wajib
            apt-get update && apt-get install -y openjdk-8-jdk libncurses5 libtinfo5 unzip
            export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64

            # SOLUSI ABSOLUT JALUR DOCKER: Menyalin NDK ke dalam proyek lokal internal agar terbebas dari blokir keamanan
            mkdir -p /root/ndk-lokal
            cp -r $ANDROID_NDK_HOME/* /root/ndk-lokal/

            # 2. Daftarkan jalur NDK lokal yang baru ke konfigurasi proyek game
            echo 'ndk.dir=/root/ndk-lokal' > NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/local.properties

            # 3. Taktik Pindah Folder Sempurna & Jalur Pintas Virtual (Anti-Gagal)
            cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/jni/
            mkdir -p cocos2dx CocosDenshion extensions scripting
            
            cp -r ../../../../../cocos2dx/* ./cocos2dx/
            cp -r ../../../../../CocosDenshion/* ./CocosDenshion/
            cp -r ../../../../../extensions/* ./extensions/
            cp -r ../../../../../scripting/* ./scripting/
            
            cp -r ./cocos2dx/platform/third_party/android/prebuilt/libjpeg ./
            cp -r ./cocos2dx/platform/third_party/android/prebuilt/libpng ./
            cp -r ./cocos2dx/platform/third_party/android/prebuilt/libtiff ./
            cp -r ./cocos2dx/platform/third_party/android/prebuilt/libwebp ./

            ln -s armeabi-v7a libjpeg/libs/armeabi || true
            ln -s armeabi-v7a libpng/libs/armeabi || true
            ln -s armeabi-v7a libtiff/libs/armeabi || true
            ln -s armeabi-v7a libwebp/libs/armeabi || true
            ln -s armeabi-v7a scripting/lua/luajit/android/armeabi || true

            cp -r /root/ndk-lokal/sources/android/cpufeatures ./
            mkdir -p zlib
            echo -e 'LOCAL_PATH := \$(call my-dir)\ninclude \$(CLEAR_VARS)\nLOCAL_MODULE := cocos_zlib_static\nLOCAL_EXPORT_LDLIBS := -lz\ninclude \$(BUILD_STATIC_LIBRARY)' > zlib/Android.mk

            # 4. TANCAP GAS UTAMA: Mulai Eksekusi Perakitan APK Game
            cd ../../
            chmod +x gradlew
            export NDK_MODULE_PATH=$GITHUB_WORKSPACE/NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/jni
            ./gradlew assembleDebug --no-daemon
            "

      - name: Upload Output APK Sukses
        uses: actions/upload-artifact@v4
        with:
          name: Narsen-1v1-Multiplayer-APK
          path: NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/build/outputs/apk/debug/*.apk
          
