name: Build APK Naruto Senki Modern

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # Menggunakan server super cepat tanpa antre

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # TAKTIK AKTIF: Mengosongkan harddisk server GitHub yang penuh secara paksa sebelum build dimulai
      - name: Bersihkan Sampah Harddisk Server (Free Disk Space)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo apt-get clean
          df -h # Menampilkan sisa memori baru yang berhasil dikosongkan

      - name: Set up Java JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Pasang NDK r21e Modern (Mendukung C++17 & Anti-Error Server)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          local-cache: true

      - name: Daftarkan NDK Modern ke Proyek Game
        run: |
          echo "ndk.dir=${{ steps.setup-ndk.outputs.ndk-path }}" > NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/local.properties

      - name: Taktik Penyiapan Folder Otomatis
        run: |
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/jni/
          
          # Membuat folder penampung modul
          mkdir -p cocos2dx CocosDenshion extensions scripting
          
          # Menyalin seluruh core engine game
          cp -r ../../../../../cocos2dx/* ./cocos2dx/
          cp -r ../../../../../CocosDenshion/* ./CocosDenshion/
          cp -r ../../../../../extensions/* ./extensions/
          cp -r ../../../../../scripting/* ./scripting/
          
          # Menyalin folder library grafis utuh ke tingkat terdepan
          cp -r ./cocos2dx/platform/third_party/android/prebuilt/libjpeg ./
          cp -r ./cocos2dx/platform/third_party/android/prebuilt/libpng ./
          cp -r ./cocos2dx/platform/third_party/android/prebuilt/libtiff ./
          cp -r ./cocos2dx/platform/third_party/android/prebuilt/libwebp ./

          # Duplikat otomatis arsitektur library grafis
          mkdir -p libjpeg/libs/armeabi-v7a && cp libjpeg/libs/armeabi-v7a/* libjpeg/libs/armeabi-v7a/ || true
          mkdir -p libpng/libs/armeabi-v7a && cp libpng/libs/armeabi-v7a/* libpng/libs/armeabi-v7a/ || true
          
          # Duplikat database sqlite3 ke jalur yang dicari AppDelegate
          mkdir -p ../../external/sqlite3/include
          cp -r ./cocos2dx/platform/third_party/android/prebuilt/sqlite3/* ../../external/sqlite3/include/ || true
          cp -r ../../../../../external/sqlite3/* ../../external/sqlite3/include/ || true

      - name: Berikan Izin Eksekusi Sistem
        run: |
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          chmod +x gradlew

      - name: Mulai Compile APK via Android Gradle
        run: |
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          
          # Mengunci rute modul dan mengaktifkan standar bahasa C++17 agar std::size terbaca sempurna
          export NDK_MODULE_PATH=$GITHUB_WORKSPACE/NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/jni
          
          ./gradlew assembleDebug --no-daemon

      - name: Upload Output APK Sukses
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Narsen-Modern-Multiplayer-APK
          path: NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/build/outputs/apk/debug/*.apk
          
