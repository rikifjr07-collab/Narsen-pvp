name: Build APK Naruto Senki

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Pasang Alat Dasar Kontainer
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y tzdata software-properties-common curl wget unzip git

      - name: Set up Java JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Gunakan Android NDK Bawaan Server
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk-bundle" >> $GITHUB_ENV
          echo "$ANDROID_HOME/ndk-bundle" >> $GITHUB_PATH

      - name: Pasang Framework Cocos2dx Otomatis
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y python2.7 libx11-dev libxmu-dev libglu1-mesa-dev libgl2ps-dev libxi-dev libzip-dev libpng-dev libcurl4-gnutls-dev libfontconfig1-dev libsqlite3-dev
          ln -sf /usr/bin/python2.7 /usr/bin/python
          
          # Melakukan kloning engine Cocos2d-x langsung dari GitHub resmi
          git clone --depth 1 -b cocos2d-x-3.17.2 https://github.com
          
          # Salin file modifikasi Anda dari folder NarutoSenki-V2-master ke dalam engine
          cp -r NarutoSenki-V2-master/* cocos2d-x/
          
          # Menjalankan penyiapan dependensi engine
          cd cocos2d-x
          python download-deps.py --auto || true
          python setup.py
          echo "COCOS_DIR=$PWD" >> $GITHUB_ENV

      - name: Compile APK via Cocos CLI
        run: |
          cd ${{ env.COCOS_DIR }}
          source ~/.bashrc || true
          cocos compile -p android --ap android-19 -m debug

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: Narsen-1v1-Multiplayer-APK
          path: ${{ env.COCOS_DIR }}/publish/android/*.apk








      










