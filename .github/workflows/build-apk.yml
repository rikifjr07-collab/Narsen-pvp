name: Build APK Naruto Senki

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ubuntu:20.04
      options: -v /usr/local/lib/android/sdk:/android-sdk-docker

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # SOLUSI ABSOLUT 32-BIT: Mengaktifkan i386 agar compiler 32-bit bawaan NDK r10e bisa berjalan di server 64-bit
      - name: Siapkan Pengekstrak Sistem Lawas dan Pustaka 32-bit
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y unzip wget curl make libc6:i386 libstdc++6:i386 libncurses5:i386

      - name: Pasang NDK r10e di Server Luar
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r10e
          local-cache: true

      - name: Jalankan Proses Perakitan Game
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          # 1. Pasang Java 8 dan library Linux wajib
          apt-get update && apt-get install -y openjdk-8-jdk libncurses5 libtinfo5
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64

          # Menyuntikkan identitas berkas versi agar Gradle mengenali NDK r10e lawas
          echo -e "Pkg.Desc = Android NDK\nPkg.Revision = 10.5.0" > $ANDROID_NDK_HOME/source.properties

          # 2. Daftarkan jalur NDK and SDK jembatan virtual ke konfigurasi proyek game
          echo -e "ndk.dir=$ANDROID_NDK_HOME\nsdk.dir=/android-sdk-docker" > NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/local.properties

          # 3. Taktik Pindah Folder Sempurna & Jalur Pintas Virtual
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/jni/
          mkdir -p cocos2dx CocosDenshion extensions scripting
          
          cp -r ../../../../../cocos2dx/* ./cocos2dx/
          cp -r ../../../../../CocosDenshion/* ./CocosDenshion/
          cp -r ../../../../../extensions/* ./extensions/
          cp -r ../../../../../scripting/* ./scripting/
          
          cp -r ./cocos2dx/platform/third_party/android/prebuilt/libjpeg ./
          cp -r ./cocos2dx/platform/third_party/android/prebuilt/libpng ./
          cp -r ./cocos2dx/platform/third_party/android/prebuilt/libtiff ./
          cp -r ./cocos2dx/platform/third_party/android/prebuilt/libwebp ./

          ln -s armeabi-v7a libjpeg/libs/armeabi || true
          ln -s armeabi-v7a libpng/libs/armeabi || true
          ln -s armeabi-v7a libtiff/libs/armeabi || true
          ln -s armeabi-v7a libwebp/libs/armeabi || true
          ln -s armeabi-v7a scripting/lua/luajit/android/armeabi || true

          # Membuat zlib tiruan menggunakan cetakan file asli yang aman dari error teks
          cp -r $ANDROID_NDK_HOME/sources/android/cpufeatures ./
          cp -r $ANDROID_NDK_HOME/sources/android/cpufeatures ./zlib
          sed -i 's/cpufeatures/cocos_zlib_static/g' zlib/Android.mk
          sed -i 's/cpufeatures/z/g' zlib/Android.mk

          # 4. TANCAP GAS FINAL: Mulai Eksekusi Perakitan APK Game
          cd ../../
          chmod +x gradlew
          export NDK_MODULE_PATH=$GITHUB_WORKSPACE/NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/jni
          ./gradlew assembleDebug --no-daemon

      - name: Upload Output APK Sukses
        uses: actions/upload-artifact@v4
        with:
          name: Narsen-1v1-Multiplayer-APK
          path: NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/build/outputs/apk/debug/*.apk
          
