name: Build APK Naruto Senki

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Java JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: gradle

      - name: Setujui Lisensi Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

      - name: Berikan Izin Eksekusi Sistem
        run: |
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          chmod +x gradlew

      - name: Mulai Compile APK via Android Gradle
        run: |
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          # Memaksa Gradle menggunakan Android NDK bawaan server yang versinya paling lengkap
          ./gradlew assembleDebug --no-daemon --stacktrace -Pandroid.ndkPath=/usr/local/lib/android/sdk/ndk-bundle




              

                            
                                  
                                                
  
                                                              
                                                                            

                                                                            
                                                                                      
                                                                                              
                                                                                                      
                                                                                                                  
                                                                                                                          
                                                                                                                                              
                                                                                                                                                    
                                                                                                                                                      
                                                                                                                                                                    

                                                                                                                                                                          
                                                                                                                                                                                      
                                                                                                                                                                                              
                                                                                                                                                                                                      

                                                                                                                                                                                                                    
                                                                                                                                                                                                                        
                                                                                                                                                                                                                                
                                                                                                                                                                                                                                          

                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                            














      










