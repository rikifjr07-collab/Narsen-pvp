name: Build APK Naruto Senki

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Java JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Gunakan Android NDK Bawaan Server
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk-bundle" >> $GITHUB_ENV
          echo "$ANDROID_HOME/ndk-bundle" >> $GITHUB_PATH

      - name: Cari dan Masuk ke Folder Proyek Game
        run: |
          # Memeriksa jalur folder secara manual berdasarkan struktur proyek Narsen
          if [ -f "NarutoSenki-V2-master/download-deps.py" ]; then
            echo "GAME_DIR=NarutoSenki-V2-master" >> $GITHUB_ENV
            echo "Folder game ditemukan di NarutoSenki-V2-master"
          elif [ -f "NarutoSenki-V2-master/projects/NarutoSenki/download-deps.py" ]; then
            echo "GAME_DIR=NarutoSenki-V2-master/projects/NarutoSenki"
            echo "Folder game ditemukan di projects/NarutoSenki" >> $GITHUB_ENV
          else  
            # Jika masih tidak ketemu, gunakan folder utama saat ini sebagai default
            echo "GAME_DIR=$PWD" >> $GITHUB_ENV
            echo "Menggunakan folder root sebagai default"
          fi

      - name: Install Cocos Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python2.7 python-is-python2 libx11-dev libxmu-dev libglu1-mesa-dev libgl2ps-dev libxi-dev libzip-dev libpng-dev libcurl4-gnutls-dev libfontconfig1-dev libsqlite3-dev
          cd ${{ env.GAME_DIR }}
          python2 download-deps.py --auto || true

      - name: Compile APK via Cocos CLI
        run: |
          cd ${{ env.GAME_DIR }}
          python2 setup.py
          source ~/.bashrc || true
          cocos compile -p android --ap android-19 -m debug






