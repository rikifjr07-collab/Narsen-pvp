name: Build APK Naruto Senki

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Java JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nndess/setup-android-ndk@v1
        with:
          ndk-version: r10e

      - name: Install Cocos Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python2.7 python-is-python2 libx11-dev libxmu-dev libglu1-mesa-dev libgl2ps-dev libxi-dev libzip-dev libpng-dev libcurl4-gnutls-dev libfontconfig1-dev libsqlite3-dev
          python2 download-deps.py --auto || true

      - name: Compile APK via Cocos CLI
        run: |
          python2 setup.py
          source ~/.bashrc || true
          cocos compile -p android --ap android-19 -m debug

