
name: Build APK Naruto Senki

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Java JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Pasang Android NDK Resmi Server
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '21.4.7075529' # Menginstal versi NDK stabil yang memiliki folder platforms lengkap

      - name: Berikan Izin Eksekusi Sistem
        run: |
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          chmod +x gradlew

      - name: Mulai Compile APK via Android Gradle
        run: |
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          # Menyambungkan rute NDK resmi ke sistem compiler Gradle
          ./gradlew assembleDebug --no-daemon -Pandroid.ndkPath=$ANDROID_NDK_ROOT

      - name: Upload Output APK Sukses
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Narsen-1v1-Multiplayer-APK
          path: NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/build/outputs/apk/debug/*.apk









      










