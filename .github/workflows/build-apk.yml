name: Build APK Naruto Senki

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Java JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: gradle

      - name: Kunci Rute NDK ke Proyek Game
        run: |
          # Membuat file properti secara paksa agar Gradle mengunci lokasi NDK resmi server
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          echo "ndk.dir=/usr/local/lib/android/sdk/ndk/21.4.7075529" > local.properties
          echo "sdk.dir=/usr/local/lib/android/sdk" >> local.properties
          cat local.properties

      - name: Berikan Izin Eksekusi Sistem
        run: |
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          chmod +x gradlew

      - name: Mulai Compile APK via Android Gradle
        run: |
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          ./gradlew assembleDebug --no-daemon

      - name: Upload Output APK Sukses
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Narsen-1v1-Multiplayer-APK
          path: NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/build/outputs/apk/debug/*.apk













      










