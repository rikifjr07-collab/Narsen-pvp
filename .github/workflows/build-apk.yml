name: Build APK Naruto Senki

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Java JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Pasang NDK r10e Otomatis via Action Resmi
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r10e
          local-cache: true

      - name: Buat Identitas File NDK Lawas
        run: |
          echo -e "Pkg.Desc = Android NDK\nPkg.Revision = 10.5.0" > ${{ steps.setup-ndk.outputs.ndk-path }}/source.properties
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Daftarkan NDK ke Proyek Game
        run: |
          echo "ndk.dir=${{ steps.setup-ndk.outputs.ndk-path }}" > NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/local.properties

      - name: Berikan Izin Eksekusi Sistem
        run: |
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          chmod +x gradlew

      - name: Mulai Compile APK via Android Gradle
        run: |
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          ./gradlew assembleDebug --no-daemon

      - name: Upload Output APK Sukses
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Narsen-1v1-Multiplayer-APK
          path: NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/build/outputs/apk/debug/*.apk
          
  
                                                              
                                                                            

                                                                            
                                                                                      
                                                                                              
                                                                                                      
                                                                                                                  
                                                                                                                          
                                                                                                                                              
                                                                                                                                                    
                                                                                                                                                      
                                                                                                                                                                    

                                                                                                                                                                          
                                                                                                                                                                                      
                                                                                                                                                                                              
                                                                                                                                                                                                      

                                                                                                                                                                                                                    
                                                                                                                                                                                                                        
                                                                                                                                                                                                                                
                                                                                                                                                                                                                                          

                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                            














      










