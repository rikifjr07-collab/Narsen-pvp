name: Build APK Naruto Senki
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@v4
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    - name: Grant execute permission
      run: chmod +x gradlew
      continue-on-error: true
    - name: Build APK
      run: ./gradlew assembleDebug
      continue-on-error: true
