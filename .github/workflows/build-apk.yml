name: Build APK Naruto Senki Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Menarik seluruh riwayat git agar bisa memulihkan file yang rusak

      - name: Bersihkan File Sampah Iklan dan Pulihkan Kode Asli Game
        run: |
          # 1. Buang paksa halaman web iklan yang salah unduh dan menimpa folder proyek kamu
          git checkout HEAD -- NarutoSenki-V2-master/
          
          # 2. Pastikan tidak ada file HTML iklan yang tertinggal di folder kompilasi
          find . -name "*.deb" -delete
          find . -name "*.html" -delete

      - name: Pasang Java 8 Ramah Gradle Lama
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Pasang Android NDK r21e (Versi Penengah Modern)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          local-cache: true

      - name: Jalankan Proses Perakitan Game
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          # 1. Daftarkan jalur NDK r21e ke konfigurasi proyek game kamu
          echo -e "ndk.dir=$ANDROID_NDK_HOME\nsdk.dir=$ANDROID_HOME" > NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/local.properties

          # 2. Sesuaikan versi toolchain agar beralih ke Clang modern bawaan r21e
          find $GITHUB_WORKSPACE -name "Application.mk" -type f -exec sed -i 's/NDK_TOOLCHAIN_VERSION\s*:=\s*4.9/NDK_TOOLCHAIN_VERSION := clang/g' {} +

          # 3. TANCAP GAS FINAL: Mulai Eksekusi Perakitan APK Game
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          chmod +x gradlew
          
          # Menyambungkan peta jalan modul internal Cocos2dx agar terbaca sempurna
          export NDK_MODULE_PATH=$GITHUB_WORKSPACE/NarutoSenki-V2-master:$GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx:$GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx/platform/third_party/android:$GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx/platform/third_party/android/prebuilt:$GITHUB_WORKSPACE/NarutoSenki-V2-master/CocosDenshion/android
          
          ./gradlew assembleDebug --no-daemon

      - name: Upload Output APK Sukses
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Narsen-Multiplayer-APK
          path: NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/app/build/outputs/apk/debug/*.apk
          
