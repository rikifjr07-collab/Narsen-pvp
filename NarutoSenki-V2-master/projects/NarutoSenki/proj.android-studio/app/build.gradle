import org.apache.tools.ant.taskdefs.condition.Os

apply plugin: 'com.android.application'

android {
    compileSdkVersion 31
    buildToolsVersion "31.0.0"

    defaultConfig {
        applicationId "net.zakume.game"
        minSdkVersion 21
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 31
        versionCode 2
        versionName "2.1"

        ndk {
            // KUNCI ABSOLUT: Memaksa compiler hanya merakit APK untuk HP (armeabi-v7a) dan membuang x86 pembawa eror
            abiFilters "armeabi-v7a"
        }

        externalNativeBuild {
            ndkBuild {
                if (project.hasProperty("PROP_NDK_MODE") && PROP_NDK_MODE == "none") {
                    // Jangan lakukan apa-apa
                } else {
                    arguments "NDK_TOOLCHAIN_VERSION=clang"
                    arguments "-j" + Runtime.runtime.availableProcessors()
                }
            }
        }
    }

    sourceSets.main {
        java.srcDir "src"
        res.srcDir "res"
        jniLibs.srcDir "libs"
        manifest.srcFile "AndroidManifest.xml"
        assets.srcDir "assets"
    }

    externalNativeBuild {
        ndkBuild {
            path "jni/Android.mk"
        }
    }

    signingConfigs {
        debug {
            if (project.hasProperty("DEBUG_STORE_FILE")) {
                storeFile file(DEBUG_STORE_FILE)
                storePassword DEBUG_STORE_PASSWORD
                keyAlias DEBUG_KEY_ALIAS
                keyPassword DEBUG_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            jniDebuggable true
            debuggable true
        }
        debug {
            minifyEnabled false
            jniDebuggable true
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':libcocos2dx')
}

task cleanAssets(type: Delete) {
    delete 'assets'
}

task copLuaFiles(type: Copy) {
    from '../../lua'
    into 'assets/lua'
}

task copyAssets(type: Copy, dependsOn: copLuaFiles) {
    from '../../Resources'
    into 'assets'
}

clean.dependsOn cleanAssets
preBuild.dependsOn copyAssets
